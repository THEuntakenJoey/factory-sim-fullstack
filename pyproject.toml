[project]
name = "factory-sim-fullstack"
version = "0.1.0"
description = "Full-stack factory simulation platform with discrete-event simulation (DES), kinematic physics engine, interactive track builder, and real-time web UI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "matplotlib>=3.10.8",
    "numpy>=2.3.5",
    "uvicorn>=0.52.4",
    "websockets>=17.1",
]
