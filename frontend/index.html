<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FactorySim Full Stack | OHT & Semiconductor Fab Simulator</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #0f172a; color: #f8fafc; overflow: hidden; }
        #root { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
        
        .topbar {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            display: flex;
            padding: 0 16px;
            align-items: center;
            height: 48px;
            gap: 24px;
        }
        
        .tab-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 14px;
            font-weight: 600;
            padding: 14px 0;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }
        .tab-btn:hover { color: #f8fafc; }
        .tab-btn.active {
            color: #38bdf8;
            border-bottom-color: #38bdf8;
        }

        .badge {
            background: #ef4444;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 6px;
        }

        .workspace { display: flex; flex: 1; overflow: hidden; }

        /* Sidebar Styling */
        .sidebar { 
            width: 340px; 
            background: #1e293b; 
            border-right: 1px solid #334155; 
            padding: 16px; 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
            overflow-y: auto;
            z-index: 10;
        }
        
        .main-content { 
            flex: 1; 
            display: flex; 
            flex-direction: column;
            position: relative; 
            height: 100%;
            background-color: #090d16;
        }

        .canvas-container {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
        }

        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
        }

        .panel { 
            background: #0f172a; 
            padding: 14px; 
            border-radius: 8px; 
            border: 1px solid #334155; 
        }
        
        .panel h3 { 
            margin: 0 0 10px 0; 
            font-size: 14px; 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
            color: #94a3b8; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .metric-value { font-size: 22px; font-weight: 700; color: #38bdf8; }
        
        .tool-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .tool-btn {
            background: #334155;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 10px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            text-align: center;
            transition: all 0.15s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .tool-btn:hover { background: #475569; }
        .tool-btn.active {
            background: #0284c7;
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        .tool-sub {
            font-size: 11px;
            color: #cbd5e1;
            font-weight: normal;
        }

        button.action-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.15s ease;
        }
        button.action-btn:hover { background: #1d4ed8; }

        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

        .helper-banner {
            position: absolute;
            top: 12px;
            left: 16px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid #334155;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            color: #cbd5e1;
            pointer-events: none;
            display: flex;
            gap: 16px;
            z-index: 5;
        }

        .helper-item b { color: #38bdf8; }

        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 13px;
        }

        .form-row > span {
            white-space: nowrap;
            color: #cbd5e1;
            margin-right: 12px;
        }

        .form-row > input:not([type="checkbox"]), .form-row > select {
            width: 130px;
            box-sizing: border-box;
        }

        input, select {
            background: #1e293b;
            border: 1px solid #475569;
            color: #f8fafc;
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 13px;
        }

        /* Save Button & Indicators */
        .save-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s ease;
            user-select: none;
            white-space: nowrap;
        }
        .save-btn.clean {
            background: #334155;
            color: #cbd5e1;
            border-color: #475569;
        }
        .save-btn.clean:hover {
            background: #475569;
            color: #f8fafc;
        }
        .save-btn.dirty {
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            color: #ffffff;
            border-color: #38bdf8;
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.45);
        }
        .save-btn.dirty:hover {
            background: linear-gradient(135deg, #0369a1 0%, #1d4ed8 100%);
            box-shadow: 0 0 18px rgba(56, 189, 248, 0.65);
            transform: translateY(-1px);
        }
        .save-btn.saving {
            background: #1e3a8a;
            color: #93c5fd;
            border-color: #3b82f6;
            cursor: wait;
        }
        .save-btn.saved {
            background: #059669;
            color: #ffffff;
            border-color: #34d399;
            box-shadow: 0 0 12px rgba(52, 211, 153, 0.4);
        }
        .save-btn.error {
            background: #dc2626;
            color: #ffffff;
            border-color: #f87171;
        }

        .spinner {
            width: 13px;
            height: 13px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            display: inline-block;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 500;
            padding: 3px 6px;
            border-radius: 4px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            user-select: none;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-dot.dirty {
            background: #f59e0b;
            box-shadow: 0 0 8px #f59e0b;
            animation: pulseDot 1.8s infinite;
        }
        .status-dot.clean {
            background: #10b981;
            box-shadow: 0 0 4px #10b981;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }

        /* Toast Container */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 1000;
            pointer-events: none;
        }
        .toast {
            pointer-events: auto;
            min-width: 260px;
            max-width: 440px;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            animation: slideInUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .toast.success {
            background: rgba(6, 78, 59, 0.95);
            border: 1px solid #10b981;
            color: #ecfdf5;
        }
        .toast.error {
            background: rgba(127, 29, 29, 0.95);
            border: 1px solid #ef4444;
            color: #fef2f2;
        }
        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Modal styling */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .modal-box {
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 10px;
            padding: 22px;
            width: 420px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6);
        }
        .modal-box h3 {
            margin: 0 0 10px 0;
            color: #f8fafc;
            font-size: 16px;
        }
        .modal-box p {
            margin: 0 0 20px 0;
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.5;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        /* Machine Designer Specifics */
        .designer-grid-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                linear-gradient(to right, #1e293b 1px, transparent 1px),
                linear-gradient(to bottom, #1e293b 1px, transparent 1px);
            background-size: 50px 50px;
            background-position: center center;
        }

        .machine-block {
            background: rgba(2, 132, 199, 0.2);
            border: 2px solid #38bdf8;
            position: relative;
            transition: all 0.2s ease;
        }

        .port-node {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fbbf24;
            border: 2px solid #0f172a;
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 10;
        }
        
        .port-node.LOAD { background: #4ade80; }
        .port-node.UNLOAD { background: #ef4444; }
        .port-node.BOTH { background: #fbbf24; }

        .list-item {
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .list-item:hover { border-color: #475569; }
        .list-item.selected { border-color: #38bdf8; background: rgba(56, 189, 248, 0.1); }

        /* Simulation Tab Styling */
        .sim-floating-bar {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(12px);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 12px 28px -6px rgba(0, 0, 0, 0.65);
            z-index: 20;
            user-select: none;
        }

        .sim-pill-btn {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #475569;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .sim-pill-btn:hover {
            background: #334155;
            color: #f8fafc;
            border-color: #64748b;
        }
        .sim-pill-btn.active {
            background: #0284c7;
            color: #ffffff;
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }
        .sim-pill-btn.primary {
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            color: #ffffff;
            border-color: #38bdf8;
        }
        .sim-pill-btn.primary:hover {
            background: linear-gradient(135deg, #0369a1 0%, #1d4ed8 100%);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
        }
        .sim-pill-btn.danger {
            background: #7f1d1d;
            color: #fca5a5;
            border-color: #dc2626;
        }
        .sim-pill-btn.danger:hover {
            background: #991b1b;
            color: #fee2e2;
        }

        .sim-clock-badge {
            background: #090d16;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 4px 10px;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 13px;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 0.05em;
        }

        .sim-kpi-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .sim-kpi-card {
            background: #090d16;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: relative;
            overflow: hidden;
        }
        .sim-kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: #38bdf8;
        }
        .sim-kpi-card.green::before { background: #10b981; }
        .sim-kpi-card.amber::before { background: #f59e0b; }
        .sim-kpi-card.purple::before { background: #a855f7; }

        .sim-kpi-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
        }
        .sim-kpi-value {
            font-size: 20px;
            font-weight: 700;
            color: #f8fafc;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
        }
        .sim-kpi-sub {
            font-size: 11px;
            color: #64748b;
        }

        .sim-legend-box {
            position: absolute;
            bottom: 16px;
            left: 16px;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(10px);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px 14px;
            z-index: 15;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 11px;
            color: #94a3b8;
        }
        .sim-heat-bar {
            width: 180px;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(to right, #22c55e, #eab308, #ef4444);
        }

        .sim-view-controls {
            position: absolute;
            bottom: 16px;
            right: 16px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 6px;
            z-index: 15;
            display: flex;
            gap: 6px;
        }

        .state-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .state-badge.IDLE { background: #334155; color: #94a3b8; }
        .state-badge.PROCESSING { background: #0369a1; color: #7dd3fc; border: 1px solid #0284c7; }
        .state-badge.PAUSED_BACKPRESSURE { 
            background: #78350f; 
            color: #fde68a; 
            border: 1px solid #f59e0b;
            animation: pulseWarning 1.5s infinite;
        }
        .state-badge.MOVING_TO_PICKUP { background: #1e3a8a; color: #93c5fd; }
        .state-badge.MOVING_TO_DELIVER { background: #065f46; color: #6ee7b7; }
        .state-badge.WAITING_TRAFFIC { background: #7c2d12; color: #fdba74; }
        .state-badge.LOADING, .state-badge.UNLOADING { background: #581c87; color: #d8b4fe; }

        @keyframes pulseWarning {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.75; transform: scale(0.98); }
        }

        .sim-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }
        .sim-table th {
            text-align: left;
            color: #94a3b8;
            padding: 6px 4px;
            border-bottom: 1px solid #334155;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .sim-table td {
            padding: 6px 4px;
            border-bottom: 1px solid #1e293b;
            color: #e2e8f0;
        }
        .sim-table tr:hover td {
            background: rgba(56, 189, 248, 0.05);
        }

        .sim-bar-bg {
            background: #1e293b;
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            width: 100%;
        }
        .sim-bar-fill {
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="js/api.js?v=7"></script>
    <script src="js/builder.js?v=7"></script>
    <script src="js/renderer.js?v=7"></script>

    <script type="text/babel" src="js/components/MapBuilderTab.jsx?v=7"></script>
    <script type="text/babel" src="js/components/MachineDesignerTab.jsx?v=7"></script>
    <script type="text/babel" src="js/components/RecipeManagerTab.jsx?v=7"></script>
    <script type="text/babel" src="js/components/SimulationTab.jsx?v=7"></script>
    <script type="text/babel" src="js/components/App.jsx?v=7"></script>
</body>
</html>
